[project]
name = "quicksecret"
version = "0.1.0"
description = "A minimal tool to fetch secrets from Infisical using machine identity"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Julius Daub" }
]
license = { text = "MIT" }
keywords = ["infisical", "secrets", "management", "machine-identity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "infisical-python>=2.3.6",
]

[project.urls]
Homepage = "https://github.com/juliusdaub/quicksecret"
Repository = "https://github.com/juliusdaub/quicksecret"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quicksecret"]
